name: Daily Jira triage

on:
  schedule:
    # 17:00 UTC = 10:00 America/Phoenix (no DST). After the 09:00 Splunk pull.
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: daily-jira-triage
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Export triaged bugs
        working-directory: server
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: npx tsx src/scripts/exportJiraTriage.ts

      - name: Commit triage snapshot
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jira-triage.json
          if git diff --cached --quiet; then
            echo "No triage changes to commit"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          git commit -m "chore(data): Jira triage snapshot ${day}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
